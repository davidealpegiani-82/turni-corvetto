<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0c0f" />
  <title>Corvetto Pulse</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js" defer></script>
  <style>
    :root {
      --bg: #0a0c0f;
      --surface: #12151c;
      --surface2: #1a1f2a;
      --line: #2a3140;
      --text: #f2f4f7;
      --muted: #9aa3b2;
      --accent: #c8f135;
      --accent-ink: #12140a;
      --danger: #ff6b7a;
      --ok: #7ddea0;
      --warn: #f0c14a;
      --radius: 12px;
      --font: "DM Sans", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      --pad: 16px;
      --dock-h: 72px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
    body { min-height: 100dvh; padding-bottom: calc(var(--dock-h) + 16px); }
    button, input, select { font: inherit; color: inherit; }
    button {
      border: 1px solid var(--line);
      background: var(--surface2);
      color: var(--text);
      border-radius: 10px;
      min-height: 44px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
    }
    button.ghost { background: transparent; }
    button:active { transform: scale(0.98); }

    .app { max-width: 480px; margin: 0 auto; padding: var(--pad); }

    .top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin-bottom: 18px; position: sticky; top: 0; z-index: 20;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(10px);
      padding: 10px 0 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .logo {
      width: 36px; height: 36px; border-radius: 8px;
      background: var(--accent); color: var(--accent-ink);
      display: grid; place-items: center;
      font-weight: 800; font-size: 14px;
    }
    .brand h1 {
      margin: 0; font-size: 15px; letter-spacing: 0.12em;
      text-transform: uppercase; font-weight: 800;
    }
    .brand small {
      display: block; color: var(--muted); font-family: var(--mono);
      font-size: 10px; letter-spacing: 0.06em; margin-top: 2px;
    }
    .week-nav { display: flex; align-items: center; gap: 6px; }
    .week-nav button { min-width: 40px; padding: 8px; }
    .week-label {
      font-family: var(--mono); font-size: 11px; font-weight: 600;
      min-width: 92px; text-align: center; color: var(--text);
    }

    .status {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 12px; border-radius: 999px;
      background: var(--surface); border: 1px solid var(--line);
      font-size: 12px; font-weight: 700; margin-bottom: 14px;
    }
    .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
    .status.warn .dot { background: var(--warn); }
    .status.bad .dot { background: var(--danger); }

    .section-label {
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--muted); margin: 16px 0 8px;
      font-weight: 600;
    }

    .zones { display: grid; gap: 8px; }
    .zone {
      text-align: left; width: 100%;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 14px;
      border-left: 3px solid var(--line);
    }
    .zone.active { border-left-color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
    .zone-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .zone-top strong { font-size: 15px; }
    .pill {
      font-family: var(--mono); font-size: 10px; font-weight: 700;
      letter-spacing: 0.06em; padding: 4px 8px; border-radius: 6px;
    }
    .pill.ok { background: rgba(125,222,160,.15); color: var(--ok); }
    .pill.warn { background: rgba(240,193,74,.15); color: var(--warn); }
    .pill.bad { background: rgba(255,107,122,.15); color: var(--danger); }
    .zone-metrics { margin-top: 8px; font-family: var(--mono); font-size: 12px; font-weight: 600; }
    .zone-hint { margin-top: 4px; font-size: 12px; color: var(--muted); }

    .days {
      display: flex; gap: 8px; overflow-x: auto;
      padding-bottom: 8px; -webkit-overflow-scrolling: touch;
      scroll-snap-type: x proximity;
    }
    .day {
      flex: 0 0 60px; scroll-snap-align: start;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 10px; padding: 10px 6px; text-align: center;
      min-height: 64px;
    }
    .day.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .day .n { font-size: 11px; color: var(--muted); font-weight: 700; }
    .day .d { font-family: var(--mono); font-size: 16px; font-weight: 700; margin-top: 2px; }
    .day .heat { height: 3px; border-radius: 2px; background: var(--ok); margin-top: 8px; }
    .day.heat-warn .heat { background: var(--warn); }
    .day.heat-bad .heat { background: var(--danger); }

    .panel {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 14px; margin-top: 10px;
    }
    .panel-head {
      display: flex; justify-content: space-between; align-items: center;
      gap: 8px; margin-bottom: 12px;
    }
    .panel-head h2 { margin: 0; font-size: 18px; font-weight: 800; }
    .lanes { display: grid; gap: 10px; }
    @media (min-width: 520px) { .lanes { grid-template-columns: 1fr 1fr; } }
    .lane {
      background: var(--surface2); border: 1px solid var(--line);
      border-radius: 10px; padding: 12px; min-height: 110px;
    }
    .lane.gap { border-color: color-mix(in srgb, var(--danger) 50%, var(--line)); background: rgba(255,107,122,.06); }
    .lane h3 {
      margin: 0 0 8px; font-family: var(--mono); font-size: 10px;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
    }
    .person {
      display: flex; justify-content: space-between; gap: 8px;
      padding: 8px 10px; border-radius: 8px; margin-bottom: 6px;
      background: rgba(200,241,53,.06); border: 1px solid rgba(200,241,53,.12);
      font-size: 13px; font-weight: 700;
    }
    .person span:last-child { color: var(--muted); font-family: var(--mono); font-size: 11px; font-weight: 600; }
    .gap-msg {
      color: var(--danger); font-family: var(--mono); font-size: 12px;
      font-weight: 700; padding: 10px 8px;
    }

    .actions { display: grid; gap: 8px; margin-top: 16px; }
    .actions-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .dock {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: 12px; width: min(420px, calc(100% - 20px));
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
      background: rgba(18,21,28,.94); border: 1px solid var(--line);
      border-radius: 16px; padding: 8px; z-index: 50;
      backdrop-filter: blur(12px);
    }
    .dock button {
      min-height: 52px; border: none; background: transparent;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--muted); border-radius: 10px; padding: 6px 4px;
    }
    .dock button.active, .dock button.main {
      background: var(--accent); color: var(--accent-ink);
    }
    .dock .ic { font-size: 16px; line-height: 1; }

    .sheet {
      position: fixed; inset: 0; background: rgba(0,0,0,.55);
      display: none; align-items: flex-end; justify-content: center; z-index: 80;
    }
    .sheet.open { display: flex; }
    .sheet-card {
      width: min(480px, 100%); max-height: 85dvh; overflow: auto;
      background: var(--surface); border-radius: 16px 16px 0 0;
      border: 1px solid var(--line); padding: 16px; padding-bottom: 28px;
    }
    .sheet-card h3 { margin: 0 0 8px; font-size: 18px; }
    .sheet-card p { margin: 0 0 14px; color: var(--muted); font-size: 13px; line-height: 1.4; }
    .people-pick { display: grid; gap: 6px; }
    .people-pick button { text-align: left; display: flex; justify-content: space-between; }
    .people-pick button.on { border-color: var(--accent); background: rgba(200,241,53,.1); }

    .toast {
      position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%);
      background: var(--surface2); border: 1px solid var(--line);
      color: var(--text); padding: 10px 14px; border-radius: 10px;
      font-size: 13px; font-weight: 600; z-index: 90; display: none;
      max-width: min(420px, calc(100% - 24px));
    }
    .toast.show { display: block; }

    .legacy-link {
      display: block; text-align: center; margin-top: 20px;
      color: var(--muted); font-size: 12px;
    }
    .legacy-link a { color: var(--text); }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <div class="brand">
        <div class="logo">P</div>
        <div>
          <h1>Pulse</h1>
          <small id="verLabel">CORVETTO · v11.0.0</small>
        </div>
      </div>
      <div class="week-nav">
        <button type="button" class="ghost" id="btnPrev" aria-label="Settimana precedente">‹</button>
        <div class="week-label" id="weekLabel">—</div>
        <button type="button" class="ghost" id="btnNext" aria-label="Settimana successiva">›</button>
      </div>
    </header>

    <div class="status" id="statusPill"><span class="dot"></span><span id="statusText">Caricamento…</span></div>

    <div class="section-label">Zone</div>
    <div class="zones" id="zones"></div>

    <div class="section-label">Settimana</div>
    <div class="days" id="days"></div>

    <div class="panel">
      <div class="panel-head">
        <h2 id="dayTitle">Giorno</h2>
        <button type="button" class="ghost" id="btnAssign" style="min-height:36px;font-size:12px;">Assegna</button>
      </div>
      <div class="lanes" id="lanes"></div>
    </div>

    <div class="actions">
      <button type="button" class="primary" id="btnSystem">Sistema la settimana</button>
      <div class="actions-row">
        <button type="button" id="btnPdf">Esporta PDF</button>
        <button type="button" id="btnClearDay">Pulisci giorno</button>
      </div>
    </div>

    <p class="legacy-link">Serve la vecchia app? <a href="legacy.html">Apri versione legacy</a></p>
  </div>

  <nav class="dock" aria-label="Navigazione">
    <button type="button" class="active" data-act="home"><span class="ic">▣</span>Pulse</button>
    <button type="button" class="main" data-act="system"><span class="ic">⚡</span>Sistema</button>
    <button type="button" data-act="assign"><span class="ic">＋</span>Assegna</button>
    <button type="button" data-act="pdf"><span class="ic">▦</span>PDF</button>
  </nav>

  <div class="sheet" id="sheet">
    <div class="sheet-card">
      <h3 id="sheetTitle">Assegna</h3>
      <p id="sheetSub">Scegli chi copre apertura o chiusura.</p>
      <div class="people-pick" id="peoplePick"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;">
        <button type="button" class="ghost" id="sheetClose">Chiudi</button>
        <button type="button" class="primary" id="sheetSave">Salva</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
(function () {
  const VERSION = '11.0.0';
  const STORE_KEY = 'corvetto_pulse_v11';
  const DAY_NAMES = ['Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab'];
  const DAY_LONG = ['Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];

  const WORKERS = [
    { id: 'w_davide', name: 'Alpegiani Davide', zone: 'edile', short: 'Davide' },
    { id: 'w_severin', name: 'Severin', zone: 'edile', short: 'Severin' },
    { id: 'w_poppa', name: 'Poppa', zone: 'edile', short: 'Poppa' },
    { id: 'w_caregnato', name: 'Caregnato', zone: 'edile', short: 'Caregnato' },
    { id: 'w_pino', name: 'Vartuca Pino', zone: 'edile', short: 'Pino' },
    { id: 'w_rallo', name: 'Rallo Vincenzo', zone: 'magazzino', short: 'Rallo' },
    { id: 'w_ragone', name: 'Ragone Mario', zone: 'magazzino', short: 'Ragone' },
    { id: 'w_mattia', name: 'Mattia', zone: 'magazzino', short: 'Mattia' },
    { id: 'w_giuliano', name: 'Sandrini Giuliano', zone: 'finiture', short: 'Giuliano' }
  ];

  const ZONES = [
    { id: 'edile', label: 'Banco edile', minOpen: 2, minClose: 1 },
    { id: 'magazzino', label: 'Magazzino', minOpen: 2, minClose: 1 },
    { id: 'finiture', label: 'Finiture', minOpen: 1, minClose: 1 }
  ];

  // --- date helpers ---
  function startOfWeek(d) {
    const x = new Date(d); x.setHours(12, 0, 0, 0);
    const day = (x.getDay() + 6) % 7; // mon=0
    x.setDate(x.getDate() - day);
    return x;
  }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function fmtIT(d) {
    return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0');
  }
  function weekKey(monday) {
    const y = monday.getFullYear();
    const onejan = new Date(y, 0, 1);
    const week = Math.ceil((((monday - onejan) / 86400000) + onejan.getDay() + 1) / 7);
    return y + '-W' + String(week).padStart(2, '0');
  }
  function isoDate(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  /** Finiture hours by weekday index 0=Mon .. 5=Sat */
  function finitureHours(dayIdx) {
    if (dayIdx === 5) return { open: '08:00', close: '12:00' };
    if (dayIdx === 2) return { open: '08:30', close: '12:30' };
    return { open: '08:30', close: '17:30' };
  }
  function zoneHours(zoneId, dayIdx) {
    if (zoneId === 'finiture') return finitureHours(dayIdx);
    if (dayIdx === 5) return { open: '07:00', close: '12:00' };
    return { open: '06:30', close: '17:30' };
  }

  // --- state ---
  let monday = startOfWeek(new Date());
  let dayIdx = Math.min(5, Math.max(0, ((new Date().getDay() + 6) % 7)));
  let zoneId = 'edile';
  let data = load();
  let assignSlot = 'open'; // open | close
  let draftIds = [];

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { weeks: {} };
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) {}
  }
  function ensureWeek(key) {
    if (!data.weeks[key]) data.weeks[key] = {};
    return data.weeks[key];
  }
  function dayKey(di) { return String(di); }
  function getCell(week, zid, di) {
    const w = ensureWeek(week);
    if (!w[zid]) w[zid] = {};
    if (!w[zid][dayKey(di)]) w[zid][dayKey(di)] = { open: [], close: [] };
    return w[zid][dayKey(di)];
  }

  function workersForZone(zid) {
    return WORKERS.filter(w => w.zone === zid);
  }

  function coverageFor(zid, di) {
    const key = weekKey(monday);
    const cell = getCell(key, zid, di);
    const z = ZONES.find(x => x.id === zid);
    const openN = (cell.open || []).length;
    const closeN = (cell.close || []).length;
    const openOk = openN >= z.minOpen;
    const closeOk = closeN >= z.minClose;
    let level = 'ok';
    if (!openOk && !closeOk) level = 'bad';
    else if (!openOk || !closeOk) level = 'warn';
    return { openN, closeN, openOk, closeOk, level, minOpen: z.minOpen, minClose: z.minClose };
  }

  function weekLevel() {
    let bad = 0, warn = 0;
    for (let d = 0; d < 6; d++) {
      ZONES.forEach(z => {
        const c = coverageFor(z.id, d);
        if (c.level === 'bad') bad++;
        else if (c.level === 'warn') warn++;
      });
    }
    if (bad) return { level: 'bad', text: bad + ' buchi critici' };
    if (warn) return { level: 'warn', text: warn + ' punti al limite' };
    return { level: 'ok', text: 'Settimana ok' };
  }

  // --- render ---
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove('show'), 2800);
  }

  function render() {
    document.getElementById('verLabel').textContent = 'CORVETTO · v' + VERSION;
    const end = addDays(monday, 5);
    document.getElementById('weekLabel').textContent = fmtIT(monday) + '–' + fmtIT(end);

    const st = weekLevel();
    const pill = document.getElementById('statusPill');
    pill.className = 'status' + (st.level !== 'ok' ? ' ' + st.level : '');
    document.getElementById('statusText').textContent = st.text;

    // zones
    const zonesEl = document.getElementById('zones');
    zonesEl.innerHTML = ZONES.map(z => {
      const c = coverageFor(z.id, dayIdx);
      const h = zoneHours(z.id, dayIdx);
      const active = z.id === zoneId ? ' active' : '';
      return '<button type="button" class="zone' + active + '" data-zone="' + z.id + '">' +
        '<div class="zone-top"><strong>' + z.label + '</strong><span class="pill ' + c.level + '">' +
        (c.level === 'ok' ? 'OK' : (c.level === 'bad' ? 'BUCO' : 'LIMITE')) + '</span></div>' +
        '<div class="zone-metrics">Apertura ' + c.openN + '/' + c.minOpen + ' · Chiusura ' + c.closeN + '/' + c.minClose + '</div>' +
        '<div class="zone-hint">' + h.open + ' – ' + h.close + '</div></button>';
    }).join('');

    // days
    const daysEl = document.getElementById('days');
    daysEl.innerHTML = DAY_NAMES.map((n, i) => {
      const d = addDays(monday, i);
      let heat = 'ok';
      ZONES.forEach(z => {
        const c = coverageFor(z.id, i);
        if (c.level === 'bad') heat = 'bad';
        else if (c.level === 'warn' && heat !== 'bad') heat = 'warn';
      });
      return '<button type="button" class="day heat-' + heat + (i === dayIdx ? ' active' : '') + '" data-day="' + i + '">' +
        '<div class="n">' + n + '</div><div class="d">' + d.getDate() + '</div><div class="heat"></div></button>';
    }).join('');

    // day panel
    const dDate = addDays(monday, dayIdx);
    document.getElementById('dayTitle').textContent = DAY_LONG[dayIdx] + ' · ' + fmtIT(dDate);
    const key = weekKey(monday);
    const cell = getCell(key, zoneId, dayIdx);
    const cov = coverageFor(zoneId, dayIdx);
    const hrs = zoneHours(zoneId, dayIdx);
    const z = ZONES.find(x => x.id === zoneId);

    function peopleHtml(ids) {
      if (!ids || !ids.length) return '<div class="gap-msg">Buco — serve almeno 1</div>';
      return ids.map(id => {
        const w = WORKERS.find(x => x.id === id);
        return '<div class="person"><span>' + (w ? w.short : id) + '</span><span>' + hrs.open + '–' + hrs.close + '</span></div>';
      }).join('');
    }

    document.getElementById('lanes').innerHTML =
      '<div class="lane' + (cov.openOk ? '' : ' gap') + '"><h3>Apertura · ' + z.label + ' (' + cov.openN + '/' + cov.minOpen + ')</h3>' +
      peopleHtml(cell.open) + '</div>' +
      '<div class="lane' + (cov.closeOk ? '' : ' gap') + '"><h3>Chiusura · ' + z.label + ' (' + cov.closeN + '/' + cov.minClose + ')</h3>' +
      peopleHtml(cell.close) + '</div>';
  }

  function openSheet() {
    assignSlot = 'open';
    const key = weekKey(monday);
    const cell = getCell(key, zoneId, dayIdx);
    draftIds = (cell.open || []).slice();
    const z = ZONES.find(x => x.id === zoneId);
    document.getElementById('sheetTitle').textContent = 'Assegna · ' + z.label;
    document.getElementById('sheetSub').textContent = DAY_LONG[dayIdx] + ' — tocca i nomi, poi salva. Usa i pulsanti sotto per apertura/chiusura.';
    renderPick();
    document.getElementById('sheet').classList.add('open');
  }
  function renderPick() {
    const box = document.getElementById('peoplePick');
    const list = workersForZone(zoneId);
    box.innerHTML =
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;">' +
      '<button type="button" class="' + (assignSlot === 'open' ? 'primary' : 'ghost') + '" id="slotOpen">Apertura</button>' +
      '<button type="button" class="' + (assignSlot === 'close' ? 'primary' : 'ghost') + '" id="slotClose">Chiusura</button></div>' +
      list.map(w => {
        const on = draftIds.includes(w.id);
        return '<button type="button" class="' + (on ? 'on' : '') + '" data-id="' + w.id + '"><span>' + w.name + '</span><span>' + (on ? '✓' : '') + '</span></button>';
      }).join('');
    document.getElementById('slotOpen').onclick = () => {
      const key = weekKey(monday);
      const cell = getCell(key, zoneId, dayIdx);
      if (assignSlot === 'close') cell.close = draftIds.slice();
      assignSlot = 'open';
      draftIds = (cell.open || []).slice();
      renderPick();
    };
    document.getElementById('slotClose').onclick = () => {
      const key = weekKey(monday);
      const cell = getCell(key, zoneId, dayIdx);
      if (assignSlot === 'open') cell.open = draftIds.slice();
      assignSlot = 'close';
      draftIds = (cell.close || []).slice();
      renderPick();
    };
    box.querySelectorAll('button[data-id]').forEach(btn => {
      btn.onclick = () => {
        const id = btn.getAttribute('data-id');
        if (draftIds.includes(id)) draftIds = draftIds.filter(x => x !== id);
        else draftIds.push(id);
        renderPick();
      };
    });
  }
  function saveSheet() {
    const key = weekKey(monday);
    const cell = getCell(key, zoneId, dayIdx);
    if (assignSlot === 'open') cell.open = draftIds.slice();
    else cell.close = draftIds.slice();
    save();
    document.getElementById('sheet').classList.remove('open');
    render();
    toast('Turno salvato');
  }

  function autoFillWeek() {
    const key = weekKey(monday);
    ZONES.forEach(z => {
      const pool = workersForZone(z.id).map(w => w.id);
      for (let d = 0; d < 6; d++) {
        const cell = getCell(key, z.id, d);
        if (!cell.open.length) cell.open = pool.slice(0, z.minOpen);
        if (!cell.close.length) {
          // prefer different people on close when possible
          const rest = pool.filter(id => !cell.open.includes(id));
          cell.close = (rest.length ? rest : pool).slice(0, z.minClose);
        }
      }
    });
    save();
    render();
    toast('Proposta base applicata — regola a mano dove serve');
  }

  function clearDay() {
    const key = weekKey(monday);
    const cell = getCell(key, zoneId, dayIdx);
    cell.open = [];
    cell.close = [];
    save();
    render();
    toast('Giorno svuotato per ' + ZONES.find(z => z.id === zoneId).label);
  }

  function exportPdf() {
    if (!window.jspdf || !window.jspdf.jsPDF) {
      toast('Libreria PDF non caricata — riprova tra un attimo');
      return;
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('landscape', 'mm', 'a4');
    const key = weekKey(monday);
    doc.setFontSize(14);
    doc.text('Corvetto Pulse — Turni ' + fmtIT(monday) + ' – ' + fmtIT(addDays(monday, 5)), 14, 14);
    const head = ['Zona / Ruolo'].concat(DAY_NAMES.map((n, i) => n + ' ' + addDays(monday, i).getDate()));
    const body = [];
    ZONES.forEach(z => {
      const row = [z.label];
      for (let d = 0; d < 6; d++) {
        const cell = getCell(key, z.id, d);
        const hrs = zoneHours(z.id, d);
        const names = function(ids) {
          return (ids || []).map(id => {
            const w = WORKERS.find(x => x.id === id);
            return w ? w.short : id;
          }).join(', ');
        };
        const t = 'A: ' + (names(cell.open) || '—') + '\nC: ' + (names(cell.close) || '—') + '\n' + hrs.open + '-' + hrs.close;
        row.push(t);
      }
      body.push(row);
    });
    doc.autoTable({
      startY: 20,
      head: [head],
      body: body,
      styles: { fontSize: 8, cellPadding: 2 },
      headStyles: { fillColor: [18, 21, 28], textColor: [242, 244, 247] },
      alternateRowStyles: { fillColor: [245, 246, 248] },
      bodyStyles: { textColor: [15, 20, 25] }
    });
    doc.save('Turni_Corvetto_' + key + '.pdf');
    toast('PDF scaricato');
  }

  // events
  document.getElementById('btnPrev').onclick = () => { monday = addDays(monday, -7); render(); };
  document.getElementById('btnNext').onclick = () => { monday = addDays(monday, 7); render(); };
  document.getElementById('zones').onclick = (e) => {
    const b = e.target.closest('[data-zone]');
    if (!b) return;
    zoneId = b.getAttribute('data-zone');
    render();
  };
  document.getElementById('days').onclick = (e) => {
    const b = e.target.closest('[data-day]');
    if (!b) return;
    dayIdx = parseInt(b.getAttribute('data-day'), 10);
    render();
  };
  document.getElementById('btnAssign').onclick = openSheet;
  document.getElementById('btnSystem').onclick = autoFillWeek;
  document.getElementById('btnPdf').onclick = exportPdf;
  document.getElementById('btnClearDay').onclick = clearDay;
  document.getElementById('sheetClose').onclick = () => document.getElementById('sheet').classList.remove('open');
  document.getElementById('sheetSave').onclick = saveSheet;
  document.getElementById('sheet').onclick = (e) => { if (e.target.id === 'sheet') e.target.classList.remove('open'); };

  document.querySelector('.dock').onclick = (e) => {
    const b = e.target.closest('button[data-act]');
    if (!b) return;
    const act = b.getAttribute('data-act');
    if (act === 'system') autoFillWeek();
    else if (act === 'assign') openSheet();
    else if (act === 'pdf') exportPdf();
    else render();
  };

  render();
})();
</script>
</body>
</html>
