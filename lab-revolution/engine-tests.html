<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corvetto One · test engine</title><style>body{font:15px system-ui;max-width:900px;margin:32px auto;padding:0 18px;color:#14243a;background:#f4f6f8}h1{letter-spacing:-1px}.meta{color:#66758a}.summary{padding:14px;border-radius:12px;background:#fff;margin:16px 0;font-weight:750}.ok{color:#147a50}.fail{color:#b93434}.test{background:white;padding:13px 15px;border-radius:10px;margin:8px 0;border:1px solid #e2e7ed}.test b{display:block}.test small{display:block;color:#68778b;margin-top:5px}code{font-size:12px}</style></head><body><h1>Corvetto One · test del motore</h1><p class="meta">Test isolati e ripetibili. Non leggono dati ufficiali e non applicano turni.</p><div id="summary" class="summary">Esecuzione test…</div><div id="results"></div><script src="./engine.js"></script><script>
const base=()=>({
 people:[
  {id:"davide",name:"Davide Alpegiani",skills:["apertura","ufficio"],unavailable:[]},
  {id:"caregnato",name:"Marco Caregnato",skills:["ufficio","chiusura"],unavailable:[]},
  {id:"severin",name:"Severin",skills:["ufficio"],unavailable:[]},
  {id:"pino",name:"Pino Vartuca",skills:["apertura","banco"],unavailable:[]},
  {id:"massimo",name:"Massimo Caruso",skills:["banco"],unavailable:[]},
  {id:"mario",name:"Mario Ragone",skills:["jolly"],unavailable:[]}
 ],
 assignments:[
  {id:"a1",personId:"davide",day:"mercoledi",department:"ufficio",start:"06:30",end:"12:00"},
  {id:"a2",personId:"caregnato",day:"mercoledi",department:"ufficio",start:"08:30",end:"17:30"},
  {id:"a3",personId:"severin",day:"mercoledi",department:"ufficio",start:"06:30",end:"17:30"},
  {id:"a4",personId:"pino",day:"lunedi",department:"magazzino",start:"06:30",end:"15:30"},
  {id:"a5",personId:"massimo",day:"lunedi",department:"magazzino",start:"06:30",end:"15:30"}
 ],
 requiredPairs:[{day:"lunedi",start:"06:30",end:"15:30",personIds:["pino","massimo"]}],
 coverageWindows:[
  {day:"mercoledi",department:"ufficio",start:"06:30",end:"17:30",minPeople:1},
  {day:"lunedi",department:"magazzino",start:"06:30",end:"15:30",minPeople:2}
 ]
});
const tests=[];
function test(name,fn){try{const detail=fn();tests.push({name,ok:detail===true,detail:detail===true?"Superato":String(detail)});}catch(e){tests.push({name,ok:false,detail:e.message});}}
test("Piano completo e copertura sufficiente",()=>CorvettoEngine.validatePlan(base()).status==="VALID");
test("Indisponibilità sovrapposta blocca il piano",()=>{const p=base();p.people[0].unavailable=[{day:"mercoledi",start:"07:00",end:"09:00",reason:"visita"}];return CorvettoEngine.validatePlan(p).status==="BLOCKED";});
test("Skill mancante blocca l'assegnazione",()=>{const p=base();p.assignments[0].requiredSkill="gestione-resi";return CorvettoEngine.validatePlan(p).status==="BLOCKED";});
test("Persona fuori dal gruppo ufficio del mercoledì bloccata",()=>{const p=base();p.people.push({id:"sand",name:"Sandrini",skills:["ufficio"],unavailable:[]});p.assignments.push({id:"a6",personId:"sand",day:"mercoledi",department:"ufficio",start:"12:00",end:"13:00"});return CorvettoEngine.validatePlan(p).status==="BLOCKED";});
test("Coppia magazzino incompleta bloccata",()=>{const p=base();p.assignments=p.assignments.filter(a=>a.personId!=="massimo");return CorvettoEngine.validatePlan(p).status==="BLOCKED";});
test("Assegnazioni sovrapposte alla stessa persona bloccate",()=>{const p=base();p.assignments.push({id:"overlap",personId:"davide",day:"mercoledi",department:"ufficio",start:"10:00",end:"12:30"});return CorvettoEngine.validatePlan(p).status==="BLOCKED";});
test("Candidato con disponibilità ignota non viene proposto",()=>{const people=[{id:"x",name:"Persona X",skills:["banco"]}];return CorvettoEngine.rankReplacements({people,day:"lunedi",start:"08:30",end:"17:30",department:"magazzino",requiredSkill:"banco"}).candidates.length===0;});
test("Candidato compatibile è proposto solo per revisione",()=>{const people=[{id:"x",name:"Persona X",skills:["banco"],unavailable:[]}];const r=CorvettoEngine.rankReplacements({people,day:"lunedi",start:"08:30",end:"17:30",department:"magazzino",requiredSkill:"banco"});return r.status==="CANDIDATES_FOR_REVIEW"&&r.candidates.length===1;});
test("Copertura numerica presente ma competenza scoperta blocca il piano",()=>{const p=base();p.skillCoverageWindows=[{day:"lunedi",department:"magazzino",start:"06:30",end:"15:30",requiredSkill:"carrello-elevatore",minPeople:1}];return CorvettoEngine.validatePlan(p).status==="BLOCKED"&&CorvettoEngine.validatePlan(p).blockers.some(x=>x.includes("Competenza non coperta"));});
test("Nessun candidato verificato viene dichiarato senza inventare sostituti",()=>{const people=[{id:"x",name:"Persona X",skills:["banco"],unavailable:[{day:"lunedi",start:"08:00",end:"18:00"}]}];const r=CorvettoEngine.rankReplacements({people,day:"lunedi",start:"08:30",end:"17:30",department:"magazzino",requiredSkill:"banco"});return r.status==="NO_VERIFIED_CANDIDATE"&&r.candidates.length===0&&r.reason.includes("copertura impossibile");});
test("Conflitto di turno esclude il candidato dalla sostituzione",()=>{const people=[{id:"x",name:"Persona X",skills:["banco"],unavailable:[]}];const r=CorvettoEngine.rankReplacements({people,day:"lunedi",start:"08:30",end:"17:30",department:"magazzino",requiredSkill:"banco",currentAssignments:[{personId:"x",day:"lunedi",start:"06:30",end:"15:30"}]});return r.candidates.length===0;});
test("Tre addetti disponibili ma apertura con uno solo: blocco",()=>{const p=base();p.assignments=p.assignments.filter(a=>a.personId!=="massimo");p.requiredPairs=[];p.people.push({id:"vincenzo",name:"Vincenzo Rallo",skills:["banco"],unavailable:[]});p.warehouseOpeningRules=[{day:"lunedi",start:"06:30",end:"08:30",availablePersonIds:["pino","massimo","vincenzo"],minimumWhenThreeOrMore:2}];return CorvettoEngine.validatePlan(p).status==="BLOCKED"&&CorvettoEngine.validatePlan(p).blockers.some(x=>x.includes("Apertura magazzino sotto soglia"));});
test("Apertura con due addetti su tre disponibili supera la regola",()=>{const p=base();p.people.push({id:"vincenzo",name:"Vincenzo Rallo",skills:["banco"],unavailable:[]});p.assignments.push({id:"a6",personId:"vincenzo",day:"lunedi",department:"magazzino",start:"06:30",end:"08:30"});p.warehouseOpeningRules=[{day:"lunedi",start:"06:30",end:"08:30",availablePersonIds:["pino","massimo","vincenzo"],minimumWhenThreeOrMore:2}];return CorvettoEngine.validatePlan(p).status==="VALID";});
test("Coppia preferenziale separata richiede revisione, non viene nascosta",()=>{const p=base();p.preferredPairs=[{day:"lunedi",start:"06:30",end:"15:30",personIds:["pino","mario"]}];const r=CorvettoEngine.validatePlan(p);return r.status==="NEEDS_REVIEW"&&r.warnings.some(x=>x.includes("Coppia preferenziale separata"));});
test("Evento senza tipo o orario valido blocca il piano",()=>{const p=base();p.events=[{personId:"davide",day:"mercoledi",start:"07:00",end:"08:00"}];return CorvettoEngine.validatePlan(p).status==="BLOCKED";});
test("Corso durante un turno continuo blocca e chiede di dividere il turno",()=>{const p=base();p.events=[{personId:"caregnato",day:"mercoledi",type:"corso",start:"14:00",end:"16:00",countsAsWorkHours:true}];const r=CorvettoEngine.validatePlan(p);return r.status==="BLOCKED"&&r.blockers.some(x=>x.includes("dividere il turno"));});
test("Turno diviso attorno al corso non confligge con l'evento",()=>{const p=base();p.assignments=p.assignments.filter(a=>a.personId!=="caregnato");p.assignments.push({id:"c1",personId:"caregnato",day:"mercoledi",department:"ufficio",start:"08:30",end:"12:30"},{id:"c2",personId:"caregnato",day:"mercoledi",department:"ufficio",start:"16:00",end:"17:30"});p.events=[{personId:"caregnato",day:"mercoledi",type:"corso",start:"12:30",end:"16:00",countsAsWorkHours:true}];return !CorvettoEngine.validatePlan(p).blockers.some(x=>x.includes("durante l'evento"));});
test("Pausa dichiarata come copertura viene rifiutata",()=>{const p=base();p.events=[{personId:"davide",day:"mercoledi",type:"pausa",start:"12:00",end:"12:30",countsAsCoverage:true,countsAsWorkHours:false}];return CorvettoEngine.validatePlan(p).status==="BLOCKED";});
test("Mercoledì richiede due persone in apertura e una in chiusura, non solo presenza generica",()=>{const p=base();p.officeCoverageWindows=[{day:"mercoledi",role:"apertura",start:"06:30",end:"08:30",minPeople:2},{day:"mercoledi",role:"chiusura",start:"16:30",end:"17:30",minPeople:1}];p.assignments=p.assignments.map(a=>({...a,roles:a.personId==="davide"?["apertura"]:a.personId==="caregnato"?["chiusura"]:[]}));return CorvettoEngine.validatePlan(p).status==="BLOCKED"&&CorvettoEngine.validatePlan(p).blockers.some(x=>x.toLowerCase().includes("copertura ufficio insufficiente"));});
test("Mercoledì con due in apertura e Caregnato in chiusura supera le finestre ruolo",()=>{const p=base();p.officeCoverageWindows=[{day:"mercoledi",role:"apertura",start:"06:30",end:"08:30",minPeople:2},{day:"mercoledi",role:"chiusura",start:"16:30",end:"17:30",minPeople:1}];p.assignments=p.assignments.map(a=>({...a,roles:a.personId==="davide"||a.personId==="severin"?["apertura"]:a.personId==="caregnato"?["chiusura"]:[]}));return CorvettoEngine.validatePlan(p).status==="VALID";});
test("Evento retribuito/non retribuito senza configurazione ore genera avviso",()=>{const p=base();p.events=[{personId:"davide",day:"mercoledi",type:"permesso-retribuito",start:"17:45",end:"18:00"}];const r=CorvettoEngine.validatePlan(p);return r.status==="NEEDS_REVIEW"&&r.warnings.some(x=>x.includes("Conteggio ore non configurato"));});
test("Riepilogo ore non presume il conteggio di un turno senza flag esplicito",()=>{const p={people:[{id:"x",name:"Persona X"}],assignments:[{personId:"x",day:"lunedi",start:"08:30",end:"17:30",department:"magazzino"}],events:[]};const r=CorvettoEngine.summarizeHours(p);return r.status==="NEEDS_REVIEW"&&r.people[0].knownWorkMinutes===0&&r.people[0].unknownRecordCount===1;});
test("Riepilogo ore conta solo segmenti esplicitamente retribuiti e segnala oltre soglia",()=>{const p={people:[{id:"x",name:"Persona X"}],assignments:[{personId:"x",day:"lunedi",start:"06:30",end:"17:30",countsAsWorkHours:true},{personId:"x",day:"martedi",start:"06:30",end:"17:30",countsAsWorkHours:true},{personId:"x",day:"mercoledi",start:"06:30",end:"17:30",countsAsWorkHours:true},{personId:"x",day:"giovedi",start:"06:30",end:"17:30",countsAsWorkHours:true}],events:[]};const r=CorvettoEngine.summarizeHours(p);return r.status==="NEEDS_REVIEW"&&r.people[0].knownWorkMinutes===2640&&r.people[0].overWeeklyLimit===true&&r.people[0].status==="NEEDS_HR_REVIEW";});
test("Riepilogo ore non restituisce totale affidabile se trova sovrapposizioni",()=>{const p={people:[{id:"x",name:"Persona X"}],assignments:[{personId:"x",day:"lunedi",start:"08:30",end:"12:30",countsAsWorkHours:true},{personId:"x",day:"lunedi",start:"11:30",end:"14:00",countsAsWorkHours:true}],events:[]};const r=CorvettoEngine.summarizeHours(p);return r.status==="BLOCKED"&&r.people[0].knownWorkMinutes===null&&r.people[0].status==="BLOCKED_OVERLAP";});
test("Copertura per ruolo verificata anche il martedì, non solo il mercoledì",()=>{const p=base();p.assignments.push({id:"tue1",personId:"davide",day:"martedi",department:"ufficio",start:"06:30",end:"08:30",roles:["apertura"]},{id:"tue2",personId:"caregnato",day:"martedi",department:"ufficio",start:"06:30",end:"08:30",roles:["apertura"]});p.officeCoverageWindows=[{day:"martedi",role:"apertura",start:"06:30",end:"08:30",minPeople:2}];return CorvettoEngine.validatePlan(p).status==="VALID";});
test("Copertura per ruolo con ruoli mancanti o insufficienti blocca anche fuori dal mercoledì",()=>{const p=base();p.assignments.push({id:"tue1",personId:"davide",day:"martedi",department:"ufficio",start:"06:30",end:"08:30",roles:["apertura"]});p.officeCoverageWindows=[{day:"martedi",role:"apertura",start:"06:30",end:"08:30",minPeople:2}];const r=CorvettoEngine.validatePlan(p);return r.status==="BLOCKED"&&r.blockers.some(x=>x.includes("Copertura ufficio insufficiente (martedi, apertura)"));});
test("Confronto proposte ordina prima il piano valido e non applica turni",()=>{const p=base();const q=JSON.parse(JSON.stringify(p));q.assignments=q.assignments.filter(a=>a.personId!=="massimo");const r=CorvettoEngine.compareProposals({baseline:p,proposals:[{id:"bad",label:"Scoperto",plan:q},{id:"good",label:"Valido",plan:p}]});return r.status==="HAS_VALID_PROPOSAL"&&r.proposals[0].id==="good"&&r.proposals.find(x=>x.id==="bad").status==="BLOCKED"&&r.reason.includes("non genera turni");});
test("Confronto proposte protegge le assegnazioni manuali da modifica o rimozione",()=>{const p=base();const changed=JSON.parse(JSON.stringify(p));changed.assignments.find(a=>a.id==="a1").start="07:00";const removed=JSON.parse(JSON.stringify(p));removed.assignments=removed.assignments.filter(a=>a.id!=="a1");const r=CorvettoEngine.compareProposals({baseline:p,lockedAssignmentIds:["a1"],proposals:[{id:"changed",plan:changed},{id:"removed",plan:removed},{id:"same",plan:p}]});return r.proposals[0].id==="same"&&r.proposals.filter(x=>x.status==="BLOCKED").length===2&&r.proposals.every(x=>x.id==="same"||x.blockers.some(b=>b.includes("Assegnazione manuale protetta")));});
test("Generatore produce proposte candidate senza applicarle al piano base",()=>{const p=base();const before=JSON.stringify(p.assignments);const r=CorvettoEngine.generateProposals({baseline:p,slots:[{id:"slot-tue",day:"martedi",department:"ufficio",start:"08:30",end:"12:30",eligiblePersonIds:["davide","caregnato"]}],maxProposals:4});return r.proposals.length>0&&JSON.stringify(p.assignments)===before&&r.proposals.every(x=>x.plan.assignments.some(a=>a.id==="generated-slot-tue"));});
test("Generatore si arresta se la disponibilità è sconosciuta",()=>{const p=base();p.people.push({id:"unknown",name:"Disponibilità ignota",skills:["banco"]});const r=CorvettoEngine.generateProposals({baseline:p,slots:[{id:"slot-unknown",day:"martedi",department:"magazzino",start:"08:30",end:"17:30",eligiblePersonIds:["unknown"]}]});return r.status==="NO_COMPLETE_GENERATION"&&r.proposals.length===0;});
test("Generatore non sostituisce una cella manuale protetta",()=>{const p=base();const r=CorvettoEngine.generateProposals({baseline:p,lockedAssignmentIds:["a1"],slots:[{id:"slot-locked",replaceAssignmentId:"a1",day:"mercoledi",department:"ufficio",start:"06:30",end:"12:00"}]});return r.status==="NO_COMPLETE_GENERATION"&&r.proposals.length===0&&r.errors.some(x=>x.includes("manuale protetta"));});
test("Generatore non inventa competenze richieste",()=>{const p=base();const r=CorvettoEngine.generateProposals({baseline:p,slots:[{id:"slot-skill",day:"martedi",department:"magazzino",start:"08:30",end:"17:30",requiredSkill:"ruspa"}]});return r.status==="NO_COMPLETE_GENERATION"&&r.proposals.length===0;});
test("Due slot sovrapposti non possono assegnare la stessa persona",()=>{const p=base();const r=CorvettoEngine.generateProposals({baseline:p,slots:[{id:"ov-a",day:"martedi",department:"ufficio",start:"08:30",end:"12:30",eligiblePersonIds:["davide"]},{id:"ov-b",day:"martedi",department:"ufficio",start:"10:00",end:"14:00",eligiblePersonIds:["davide"]}],maxProposals:4});return r.status==="NO_VALID_COMBINATION"&&r.proposals.length===0;});
test("Una coppia obbligatoria resta un vincolo anche durante una proposta",()=>{const p=base();const r=CorvettoEngine.generateProposals({baseline:p,slots:[{id:"pair-swap",replaceAssignmentId:"a4",day:"lunedi",department:"magazzino",start:"06:30",end:"15:30",eligiblePersonIds:["mario"]}],maxProposals:4});return r.status==="NO_VALID_PROPOSAL"&&r.proposals.length>0&&r.proposals.every(x=>x.status==="BLOCKED"&&x.blockers.some(b=>b.includes("Coppia richiesta non completa")));});
test("Generatore rifiuta ID di slot duplicati prima di creare proposte",()=>{const p=base();const slots=[{id:"dup",day:"martedi",department:"ufficio",start:"08:30",end:"12:30",eligiblePersonIds:["davide"]},{id:"dup",day:"martedi",department:"ufficio",start:"13:00",end:"17:00",eligiblePersonIds:["caregnato"]}];const r=CorvettoEngine.generateProposals({baseline:p,slots});return r.status==="NO_COMPLETE_GENERATION"&&r.proposals.length===0&&r.errors.some(x=>x.includes("ID slot duplicato"));});
test("Generatore rifiuta ID generato che collide con assegnazione esistente",()=>{const p=base();p.assignments.push({id:"generated-clash",personId:"davide",day:"martedi",department:"ufficio",start:"08:30",end:"12:30"});const r=CorvettoEngine.generateProposals({baseline:p,slots:[{id:"clash",day:"martedi",department:"ufficio",start:"13:00",end:"17:00",eligiblePersonIds:["caregnato"]}]});return r.status==="NO_COMPLETE_GENERATION"&&r.proposals.length===0&&r.errors.some(x=>x.includes("ID assegnazione generata già presente"));});
test("Generatore rifiuta ID assegnazione duplicati nel piano base",()=>{const p=base();p.assignments[1].id=p.assignments[0].id;const r=CorvettoEngine.generateProposals({baseline:p,slots:[{id:"unique",day:"martedi",department:"ufficio",start:"08:30",end:"12:30",eligiblePersonIds:["davide"]}]});return r.status==="NO_COMPLETE_GENERATION"&&r.proposals.length===0&&r.errors.some(x=>x.includes("ID di assegnazione mancanti o duplicati"));});
test("Generatore limita il numero di proposte e segnala piani da rivedere",()=>{const p=base();const r=CorvettoEngine.generateProposals({baseline:p,slots:[{id:"slot-limit",day:"martedi",department:"ufficio",start:"08:30",end:"12:30"}],maxProposals:2});return r.proposals.length<=2&&r.proposals.every(x=>x.status&&Array.isArray(x.blockers)&&Array.isArray(x.warnings));});
test("Generatore restituisce motivazioni leggibili",()=>{const p=base();const r=CorvettoEngine.generateProposals({baseline:p,slots:[{id:"slot-reasons",day:"martedi",department:"ufficio",start:"08:30",end:"12:30",eligiblePersonIds:["davide","caregnato"]}],maxProposals:3});return r.proposals.length>0&&r.proposals.every(x=>Array.isArray(x.decisionReasons)&&x.quality&&Number.isFinite(x.quality.status));});
test("Martedì: apertura con Andrea e Severin e chiusura con Davide e Severin",()=>{const p=base();p.people.push({id:"andrea",name:"Andrea",skills:["ufficio"],unavailable:[]});p.assignments.push({id:"tue-andrea",personId:"andrea",day:"martedi",department:"ufficio",start:"06:30",end:"12:30",roles:["apertura"]},{id:"tue-severin-am",personId:"severin",day:"martedi",department:"ufficio",start:"06:30",end:"12:30",roles:["apertura"]},{id:"tue-davide",personId:"davide",day:"martedi",department:"ufficio",start:"08:30",end:"17:30",roles:["chiusura"]},{id:"tue-severin-pm",personId:"severin",day:"martedi",department:"ufficio",start:"13:00",end:"17:30",roles:["chiusura"]});p.officeCoverageWindows=[{day:"martedi",role:"apertura",start:"06:30",end:"08:30",minPeople:2},{day:"martedi",role:"chiusura",start:"16:30",end:"17:30",minPeople:2}];return CorvettoEngine.validatePlan(p).status==="VALID";});
test("Mercoledì: copertura separata di apertura e chiusura con soli addetti ammessi",()=>{const p=base();p.assignments=p.assignments.filter(a=>a.day!=="mercoledi");p.assignments.push({id:"wed-davide",personId:"davide",day:"mercoledi",department:"ufficio",start:"06:30",end:"12:00",roles:["apertura"]},{id:"wed-caregnato",personId:"caregnato",day:"mercoledi",department:"ufficio",start:"08:30",end:"17:30",roles:["chiusura"]},{id:"wed-severin-am",personId:"severin",day:"mercoledi",department:"ufficio",start:"06:30",end:"12:30",roles:["apertura"]},{id:"wed-severin-pm",personId:"severin",day:"mercoledi",department:"ufficio",start:"13:00",end:"17:30",roles:["chiusura"]});p.officeCoverageWindows=[{day:"mercoledi",role:"apertura",start:"06:30",end:"08:30",minPeople:2},{day:"mercoledi",role:"chiusura",start:"16:30",end:"17:30",minPeople:2}];return CorvettoEngine.validatePlan(p).status==="VALID";});
const passed=tests.filter(t=>t.ok).length;document.querySelector("#summary").className="summary "+(passed===tests.length?"ok":"fail");document.querySelector("#summary").textContent=passed+" / "+tests.length+" test superati";document.querySelector("#results").innerHTML=tests.map(t=>'<div class="test"><b class="'+(t.ok?"ok":"fail")+'">'+(t.ok?"✓":"✗")+" "+t.name+'</b><small>'+t.detail.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))+'</small></div>').join("");
</script></body></html>
